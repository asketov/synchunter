[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synchunter"
version = "0.1.0"
description = "LLM-guided interleaving exploration for detecting synchronization defects in multi-user web applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
synchunter = "synchunter.cli:main"

[tool.setuptools]
packages = ["synchunter", "demo_app"]

[tool.setuptools.package-data]
demo_app = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
